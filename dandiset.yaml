description: 'Experiments were conducted using a four-electrode array with an inter-electrode
  distance of 10.0 mm. The Pseudo 3D model was simulated by elevating the electrode
  array (0 mm, 1 mm, and 2 mm) above the monolayer. Each single pulse in the protocol
  had a duration of 600 ns. The protocol consisted of nine packets of pulses delivered
  at a frequency of 0.2 MHz and was repeated 1, 2, 4, or 6 times at a frequency of
  1 Hz. Cell monolayer integrity was assessed using Hoechst staining, while membrane
  permeability was evaluated using YoPro-1.CT26 cells were subjected to two bursts
  of 0.2 MHz NG-CANCAN stimulation, simulating a 3D model by The images are arranged
  such that each vertical column corresponds to the same elevation level, while horizontal
  rows represent: YoPro-1 (YP) uptake across the entire treated area; zoomed YP uptake
  at the center of the array (outlined by dashed-line boxes); Propidium Iodide (PI)
  uptake across the entire treated area; and zoomed PI uptake at the center of the
  array (also outlined by dashed-line boxes). '
